<nav class="navbar">
  <div class="navbar-left">
    <span *ngFor="let rol of roles" class="role-badge">{{ rol }}</span>
  </div>

  <div class="navbar-center">
    <!-- Si quieres dejarlo vacío o con algo más, aquí -->
  </div>

  <div class="navbar-right">
    <span class="saludo-usuario">Hola, {{ nombreUsuario }}</span>

    <button class="btn-privilegios" (click)="togglePrivilegios()" aria-haspopup="true" [attr.aria-expanded]="mostrarPrivilegios">
      Privilegios ▼
    </button>

    <button class="logout-btn" (click)="logout()">
      Cerrar sesión
    </button>

    <div
      class="dropdown-privilegios"
      *ngIf="mostrarPrivilegios"
      role="menu"
      aria-label="Lista de privilegios"
    >
      <table>
        <thead>
          <tr><th>Privilegios</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of privilegios">
            <td>{{ p }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</nav>
