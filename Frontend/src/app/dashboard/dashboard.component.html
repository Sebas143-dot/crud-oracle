<!-- ============ Navbar ============ -->
<app-navbar></app-navbar>

<!-- ============ CONTENEDOR PRINCIPAL CON LAYOUT DIVIDIDO ============ -->
<div class="main-container" [class.split-layout]="showSqlPanel">
  
  <!-- ============ PANEL IZQUIERDO - TABLAS ============ -->
  <div class="left-panel" [class.collapsed]="showSqlPanel">
    <div class="container">
      <div class="dashboard-container">
        <h2 class="dashboard-title">Tablas disponibles</h2>

        <div class="error" *ngIf="error">{{error}}</div>
        <div class="no-data" *ngIf="tablas.length === 0 && !error">
          No se encontraron tablas.
        </div>

        <div class="cards-container">
          <div class="tabla-card" *ngFor="let t of tablas">
            <h3>{{t.table_name}}</h3>
            <p><strong>Owner:</strong> {{t.owner}}</p>

            <div class="privilegios">
              <span class="badge select" *ngIf="t.privileges.select">SELECT</span>
              <span class="badge insert" *ngIf="t.privileges.insert">INSERT</span>
              <span class="badge update" *ngIf="t.privileges.update">UPDATE</span>
              <span class="badge delete" *ngIf="t.privileges.delete">DELETE</span>
            </div>

            <div class="actions">
              <button class="edit-btn" (click)="editarTabla(t)" title="Modificar tabla">
                Ver datos
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ PANEL DERECHO - COMANDOS SQL ============ -->
  <div class="right-panel" *ngIf="showSqlPanel">
    <div class="sql-panel">
      <div class="panel-header">
        <h3>Ejecutor de Comandos SQL</h3>
        <button class="close-panel-btn" (click)="cerrarPanelSQL()" title="Cerrar panel">
          ✕
        </button>
      </div>

      <!-- ============ SECCIÓN DE COMANDOS PREDEFINIDOS ============ -->
      <div class="predefined-commands-section">
        <h4>Comandos Predefinidos</h4>
        
        <div class="command-selector">
          <select 
            [(ngModel)]="selectedPredefinedCommand"
            class="command-dropdown"
            [disabled]="isExecutingCommand">
            <option value="">-- Seleccionar comando --</option>
            <option 
              *ngFor="let cmd of predefinedCommands" 
              [value]="cmd.id">
              {{cmd.name}}
            </option>
          </select>
        </div>

        <!-- Descripción del comando seleccionado -->
        <div class="command-description" *ngIf="selectedPredefinedCommand">
          <p>
            <strong>Descripción:</strong> 
            {{ selectedPredefinedDescription }}
          </p>
        </div>

        <!-- Botones de acción para comandos predefinidos -->
        <div class="predefined-actions" *ngIf="selectedPredefinedCommand">
          <button 
            class="load-command-btn"
            (click)="loadPredefinedCommand()"
            [disabled]="isExecutingCommand"
            title="Cargar comando en el editor para modificarlo">
            Cargar en Editor
          </button>
          
          <button 
            class="execute-predefined-btn"
            (click)="executePredefinedCommand()"
            [disabled]="isExecutingCommand"
            title="Ejecutar comando directamente">
            <span *ngIf="!isExecutingCommand">Ejecutar Directo</span>
            <span *ngIf="isExecutingCommand">Ejecutando...</span>
          </button>
          
          <button 
            class="clear-selection-btn"
            (click)="clearSelection()"
            [disabled]="isExecutingCommand"
            title="Limpiar selección">
            Limpiar
          </button>
        </div>
      </div>

      <!-- ============ DIVISOR ============ -->
      <div class="section-divider"></div>
      
      <!-- ============ EDITOR SQL PERSONALIZADO ============ -->
      <div class="sql-editor">
        <label for="sqlCommand">Comando SQL Personalizado:</label>
        <textarea 
          id="sqlCommand"
          [(ngModel)]="currentSqlCommand" 
          (input)="onSqlCommandChange()"
          placeholder="Escribe tu comando SQL aquí o selecciona un comando predefinido arriba..."
          rows="10"
          [disabled]="isExecutingCommand">
        </textarea>
        
        <button 
          class="execute-btn" 
          (click)="ejecutarComandoSQL()" 
          [disabled]="!currentSqlCommand.trim() || isExecutingCommand">
          <span *ngIf="!isExecutingCommand">Ejecutar Comando</span>
          <span *ngIf="isExecutingCommand">Ejecutando...</span>
        </button>
      </div>

      <!-- ============ RESULTADO ============ -->
      <div class="sql-result" *ngIf="sqlResult">
        <h4>Resultado:</h4>
        <pre class="result-content">{{ sqlResult }}</pre>
      </div>
    </div>
  </div>
</div>
