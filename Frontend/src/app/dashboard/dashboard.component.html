<!-- ============ Navbar ============ -->
<app-navbar></app-navbar>

<!-- ============ LISTA DE TABLAS ============ -->
<div class="container">
  <div class="dashboard-container">
    <h2 class="dashboard-title">Tablas disponibles</h2>

    <div class="error" *ngIf="error">{{error}}</div>
    <div class="no-data" *ngIf="tablas.length === 0 && !error">
      No se encontraron tablas.
    </div>

    <div class="cards-container">
      <div class="tabla-card" *ngFor="let t of tablas">
        <h3>{{t.table_name}}</h3>
        <p><strong>Owner:</strong> {{t.owner}}</p>

        <div class="privilegios">
          <span class="badge select" *ngIf="t.privileges.select">SELECT</span>
          <span class="badge insert" *ngIf="t.privileges.insert">INSERT</span>
          <span class="badge update" *ngIf="t.privileges.update">UPDATE</span>
          <span class="badge delete" *ngIf="t.privileges.delete">DELETE</span>
        </div>

        <div class="actions">
          <button class="edit-btn" (click)="editarTabla(t)" title="Modificar tabla">
            Ver datos
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ MODAL PRINCIPAL (datos) ============ -->
<div class="modal-overlay" [class.show]="modalVisible" *ngIf="mostrarModal">
  <div class="modal" [class.show]="modalVisible">
    <h2>Contenido: {{tablaSeleccionada?.table_name}}</h2>

    <!-- Encabezado columnas / tipos -->
    <div class="tabla-wrapper" *ngIf="columnas?.length">
      <table>
        <thead>
          <tr>
            <th *ngFor="let c of columnas">
              {{c}}
              <div class="tipo-dato">{{obtenerTipoDato(c)}}</div>
            </th>
          </tr>
        </thead>
      </table>
    </div>

    <!-- Datos actuales con paginación -->
    <div class="tabla-wrapper" *ngIf="filas?.length">
      <table>
        <tbody>
          <tr *ngFor="let f of filasPaginadas">
            <td *ngFor="let cel of f">{{cel}}</td>
          </tr>
        </tbody>
      </table>

      <div class="paginacion" *ngIf="filas.length > filasPorPagina">
        <button (click)="cambiarPagina(paginaActual - 1)" [disabled]="paginaActual === 1">Anterior</button>

        <span>Página {{paginaActual}} de {{totalPaginas()}}</span>

        <button (click)="cambiarPagina(paginaActual + 1)" [disabled]="paginaActual === totalPaginas()">Siguiente</button>
      </div>
    </div>

    <button class="close-btn" (click)="cerrarModal()">Cerrar</button>
  </div>
</div>
