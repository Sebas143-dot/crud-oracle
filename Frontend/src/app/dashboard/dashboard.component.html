<div class="container">
  <div class="dashboard-container">
    <h2 class="dashboard-title">Tablas disponibles</h2>

    <!-- Errores -->
    <div *ngIf="error" class="error">{{ error }}</div>

    <!-- Sin datos -->
    <div *ngIf="tablas.length === 0 && !error" class="no-data">
      No se encontraron tablas.
    </div>

    <!-- Tarjetas de tablas -->
    <div class="cards-container">
      <div class="tabla-card" *ngFor="let tabla of tablas">
        <h3>{{ tabla.table_name }}</h3>
        <p><strong>Owner:</strong> {{ tabla.owner }}</p>

        <div class="privilegios">
          <span class="badge select"  *ngIf="tabla.privileges.select">SELECT</span>
          <span class="badge insert"  *ngIf="tabla.privileges.insert">INSERT</span>
          <span class="badge update"  *ngIf="tabla.privileges.update">UPDATE</span>
          <span class="badge delete"  *ngIf="tabla.privileges.delete">DELETE</span>
        </div>

        <div class="actions">
          <button class="edit-btn" (click)="editarTabla(tabla)">Modificar</button>
        </div>
      </div>
    </div>

    <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
  </div>
</div>

<!-- ──────── Modal ──────── -->
<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal">

    <h2>Modificar tabla: {{ tablaSeleccionada?.table_name }}</h2>

    <!-- Botones por permiso -->
    <div class="modal-actions">
      <button class="modal-btn"
              *ngIf="tablaSeleccionada?.privileges.select"
              (click)="accion('select')">SELECT</button>

      <button class="modal-btn"
              *ngIf="tablaSeleccionada?.privileges.insert"
              (click)="accion('insert')">INSERT</button>

      <button class="modal-btn"
              *ngIf="tablaSeleccionada?.privileges.update"
              (click)="accion('update')">UPDATE</button>

      <button class="modal-btn"
              *ngIf="tablaSeleccionada?.privileges.delete"
              (click)="accion('delete')">DELETE</button>
    </div>

    <!-- Encabezado columnas + tipo -->
    <div class="tabla-wrapper" *ngIf="columnas?.length">
      <table>
        <thead>
          <tr>
            <th *ngFor="let col of columnas">
              {{ col }}
              <div class="tipo-dato">{{ obtenerTipoDato(col) }}</div>
            </th>
          </tr>
        </thead>
      </table>
    </div>

    <!-- Datos actuales -->
    <div class="tabla-wrapper" *ngIf="filas?.length">
      <table>
        <tbody>
          <tr *ngFor="let fila of filas">
            <td *ngFor="let celda of fila">{{ celda }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Formulario Insert -->
    <div class="tabla-wrapper"
         *ngIf="tablaSeleccionada?.privileges.insert && nuevaFila && nuevaFila.length">
      <h4 style="margin-top:20px">Insertar nueva fila</h4>

      <table>
        <tr>
          <td *ngFor="let valor of nuevaFila; let i = index">
            <input [(ngModel)]="nuevaFila[i]" class="input-insert"/>
          </td>
        </tr>
      </table>

      <button class="modal-btn" style="margin-top:15px"
              (click)="insertarFila()">Guardar</button>
    </div>

    <button class="close-btn" (click)="cerrarModal()">Cerrar</button>
  </div>
</div>
