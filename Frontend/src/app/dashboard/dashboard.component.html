<div class="container">
  <div class="dashboard-container">
    <h2 class="dashboard-title">Tablas disponibles</h2>

    <div *ngIf="error" class="error">{{ error }}</div>

    <div *ngIf="tablas.length === 0 && !error" class="no-data">
      No se encontraron tablas.
    </div>

    <div class="cards-container">
      <div class="tabla-card" *ngFor="let tabla of tablas">
        <h3>{{ tabla.table_name }}</h3>
        <p><strong>Owner:</strong> {{ tabla.owner }}</p>

        <div class="privilegios">
          <span *ngIf="tabla.privileges.select" class="badge select">SELECT</span>
          <span *ngIf="tabla.privileges.insert" class="badge insert">INSERT</span>
          <span *ngIf="tabla.privileges.update" class="badge update">UPDATE</span>
          <span *ngIf="tabla.privileges.delete" class="badge delete">DELETE</span>
        </div>

        <div class="actions">
          <button class="edit-btn" (click)="editarTabla(tabla)">Modificar</button>
        </div>
      </div>
    </div>

    <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
  </div>
</div>

<!-- Modal -->
<div *ngIf="mostrarModal" class="modal-overlay">
  <div class="modal">
    <h2>Modificar tabla: {{ tablaSeleccionada?.table_name }}</h2>

    <!-- Botones según permisos -->
    <div class="modal-actions">
      <button class="modal-btn" *ngIf="tablaSeleccionada?.privileges.select" (click)="accion('select')">SELECT</button>
      <button class="modal-btn" *ngIf="tablaSeleccionada?.privileges.insert" (click)="accion('insert')">INSERT</button>
      <button class="modal-btn" *ngIf="tablaSeleccionada?.privileges.update" (click)="accion('update')">UPDATE</button>
      <button class="modal-btn" *ngIf="tablaSeleccionada?.privileges.delete" (click)="accion('delete')">DELETE</button>
    </div>

    <!-- Tabla de columnas y tipos -->
    <div *ngIf="columnas.length > 0" class="tabla-wrapper" style="overflow-x:auto; margin-top: 20px;">
      <table>
        <thead>
          <tr>
            <th *ngFor="let col of columnas">
              {{ col }}
              <div class="tipo-dato">{{ obtenerTipoDato(col) }}</div>
            </th>
          </tr>
        </thead>
      </table>
    </div>

    <!-- Datos actuales -->
    <div *ngIf="filas.length > 0" class="tabla-wrapper" style="overflow-x:auto; margin-top: 5px;">
      <table>
        <tbody>
          <tr *ngFor="let fila of filas">
            <td *ngFor="let celda of fila">{{ celda }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- FORMULARIO DE INSERT -->
    <div *ngIf="nuevaFila?.length > 0" class="tabla-wrapper" style="overflow-x:auto; margin-top: 20px;">
      <h4>Insertar nueva fila</h4>
      <table>
        <tbody>
          <tr>
            <td *ngFor="let col of columnas; let i = index">
              <input type="text" [(ngModel)]="nuevaFila[i]" placeholder="{{ col }}" class="input-insert"/>
            </td>
          </tr>
        </tbody>
      </table>
      <button class="modal-btn" style="margin-top: 15px;" (click)="insertarFila()">Guardar</button>
    </div>

    <button class="close-btn" (click)="cerrarModal()">Cerrar</button>
  </div>
</div>
