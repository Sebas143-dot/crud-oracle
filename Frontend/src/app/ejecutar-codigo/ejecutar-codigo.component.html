<div class="sql-panel">
  <div class="panel-header">
    <h3>Ejecutor de Comandos SQL</h3>
  </div>

  <!-- SECCIÓN DE COMANDOS PREDEFINIDOS -->
  <div class="predefined-commands-section">
    <h4>Comandos Predefinidos</h4>

    <div class="command-selector">
      <select [(ngModel)]="selectedPredefinedCommand" class="command-dropdown" [disabled]="isExecutingCommand">
        <option value="">-- Seleccionar comando --</option>
        <option *ngFor="let cmd of predefinedCommands" [value]="cmd.id">
          {{cmd.name}}
        </option>
      </select>
    </div>

    <!-- Descripción del comando seleccionado -->
    <div class="command-description" *ngIf="selectedPredefinedCommand">
      <p><strong>Descripción:</strong> {{ selectedPredefinedDescription }}</p>
    </div>

    <!-- Botones de acción para comandos predefinidos -->
    <div class="predefined-actions" *ngIf="selectedPredefinedCommand">
      <button class="load-command-btn" (click)="loadPredefinedCommand()" [disabled]="isExecutingCommand"
        title="Cargar comando en el editor para modificarlo">
        Cargar en Editor
      </button>

      <button class="execute-predefined-btn" (click)="executePredefinedCommand()" [disabled]="isExecutingCommand"
        title="Ejecutar comando directamente">
        <span *ngIf="!isExecutingCommand">Ejecutar Directo</span>
        <span *ngIf="isExecutingCommand">Ejecutando...</span>
      </button>

      <button class="clear-selection-btn" (click)="clearSelection()" [disabled]="isExecutingCommand"
        title="Limpiar selección">
        Limpiar
      </button>
    </div>
  </div>

  <!-- DIVISOR -->
  <div class="section-divider"></div>

  <!-- EDITOR SQL PERSONALIZADO -->
  <div class="sql-editor">
    <textarea id="sqlCommand" [(ngModel)]="currentSqlCommand" (input)="onSqlCommandChange()"
      placeholder="Escribe tu comando SQL aquí o selecciona un comando predefinido arriba..." rows="10"
      [disabled]="isExecutingCommand">
    </textarea>

    <!-- Resultado de la consulta -->
    <div class="sql-result" *ngIf="sqlResult">
      <h4>Resultado:</h4>
      <pre class="result-output">{{ sqlResult }}</pre>
    </div>

    <button class="execute-btn" (click)="ejecutarComandoSQL()"
      [disabled]="!currentSqlCommand.trim() || isExecutingCommand || selectedPredefinedCommand">
      <span *ngIf="!isExecutingCommand">Ejecutar Comando Manual</span>
      <span *ngIf="isExecutingCommand">⏳ Ejecutando...</span>
    </button>
  </div>
</div>
