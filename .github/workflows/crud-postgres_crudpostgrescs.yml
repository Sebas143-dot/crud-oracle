# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - CrudPostgresCS

on:
  push:
    branches:
      - crud-postgres
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        working-directory: ./Backend # <--- LÍNEA AÑADIDA/MODIFICADA
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Zip artifact for deployment
        # Si tu aplicación principal está dentro de 'Backend',
        # es probable que quieras zippear el contenido de 'Backend'
        # para que sea el root de tu App Service.
        # Considera cambiar la línea de 'run' a:
        # run: zip release.zip ./Backend -r
        # Esto asegurará que el contenido de 'Backend' sea el que se despliegue.
        # Por ahora, mantendremos el original, pero ten esto en cuenta si la app no inicia.
        run: zip release.zip ./* -r

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A88A4BA0A0C14EEBBF404EE43438FD82 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4344D933F127422A8DB5D9F23F1B553F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_02E16C7FDC694005B8C3AD595DF28135 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CrudPostgresCS'
          slot-name: 'Production'
          package: .
