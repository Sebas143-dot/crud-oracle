# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - CrudPostgresCS

on:
  push:
    branches:
      - crud-postgres
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3 # Puedes considerar @v4 para la última versión estable
        with:
          node-version: '20.x'

      # PASO 1: Instalar dependencias del Backend
      - name: npm install (Backend)
        working-directory: ./Backend
        run: npm install

      # PASO 2: Instalar dependencias del Frontend
      - name: npm install (Frontend)
        working-directory: ./Frontend
        run: npm install

      # PASO 3: Construir el Frontend para producción
      # Asegúrate de que en package.json de tu Frontend tengas un script 'build'
      # que ejecute 'ng build --configuration=production'
      - name: npm build (Frontend Production)
        working-directory: ./Frontend
        run: npm run build -- --configuration=production # Usa 'ng build --configuration=production' si no tienes un script npm

      # PASO 4: MOVER los archivos construidos del Frontend al directorio del Backend
      # Esto es CRUCIAL porque tu index.js en Backend espera el Frontend en esa ruta relativa
      # 'path.join(__dirname, '../Frontend/dist/crud/browser')' significa que el
      # directorio 'Frontend/dist/crud/browser' debe existir DENTRO de la carpeta 'Backend'
      - name: Move Frontend build to Backend serving directory
        run: |
          # Asegura que el directorio de destino exista dentro de Backend
          mkdir -p ./Backend/Frontend/dist/crud/browser
          # Mueve (o copia) el contenido del build del Frontend al lugar correcto dentro de Backend
          cp -r ./Frontend/dist/crud/browser/* ./Backend/Frontend/dist/crud/browser/
        working-directory: . # Este comando se ejecuta desde la raíz del repositorio

      # PASO 5: Zipear SOLO la carpeta Backend para el despliegue
      # Ahora, la carpeta Backend ya contiene el Frontend compilado en su estructura esperada
      - name: Zip artifact for deployment
        run: zip -r deploy_package.zip .
        working-directory: ./Backend # Zipea el contenido de la carpeta Backend

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./Backend/deploy_package.zip # La ruta al zip que acabas de crear

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        # Descomprime el paquete en la raíz de donde se desplegará.
        # El zip ya solo contiene la carpeta 'Backend'
        run: unzip deploy_package.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A88A4BA0A0C14EEBBF404EE43438FD82 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4344D933F127422A8DB5D9F23F1B553F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_02E16C7FDC694005B8C3AD595DF28135 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CrudPostgresCS'
          slot-name: 'Production'
          # El paquete que se va a desplegar es ahora la carpeta 'Backend' que se descomprimió.
          # Asegúrate de que el contenido del zip sea la raíz de tu app en App Service.
          package: ./Backend # Esto desplegará el contenido de la carpeta Backend